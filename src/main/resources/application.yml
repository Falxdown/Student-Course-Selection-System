server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
      min-spare: 20
    accept-count: 200
    max-connections: 10000

spring:
  application:
    name: campus-course-selection
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_selection?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD:campus123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CampusHikariPool
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 5
          max-wait: 1s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:campus}
    password: ${RABBITMQ_PASSWORD:campus123}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        concurrency: 4
        max-concurrency: 16
        default-requeue-rejected: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:campus-course-selection-demo-secret-key-please-change-in-production-0123456789}
    issuer: campus-course-selection
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:7200}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}
  selection:
    rate-limit-capacity: ${SELECTION_RATE_CAPACITY:10}
    rate-limit-refill-per-second: ${SELECTION_RATE_REFILL:5}
    idempotency-ttl-seconds: ${IDEMPOTENCY_TTL:86400}
    hot-cache-seconds: 30
    stale-task-seconds: 120
    reconcile-batch-size: 100
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  demo:
    enabled: ${DEMO_DATA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.campus.selection: INFO
    org.mybatis: WARN
  file:
    name: ${LOG_FILE:logs/campus-course-selection.log}
